<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 1000px;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Table</h1>
    <table border="2">
        <tr>
            <th rowspan="2">A</th>
            <th>B</th>
            <th rowspan="3">d</th>
            <th colspan="2">e</th>
            <th>F</th>
        </tr>
         <tr>
            <td>c</td>
            <td rowspan="2">g</td>
            <td rowspan="2">h</td>
            <td rowspan="2">i</td>
        </tr>
        <tr>
            <td colspan="2">j</td>
        </tr>
        <tr>
            <td colspan="3">k</td>
            <td>l</td>
            <td colspan="2">m</td>
        </tr>
    </table>
</body>
</html>
